group 'com.example.MonriPayments'
version '0.4.0'

buildscript {
  repositories {
    google()
    mavenCentral()
    maven { 
      url 'https://jitpack.io' 
    }
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.5.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['MonriAndroidIos_' + name]
}
def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['MonriAndroidIos_' + name]).toInteger()
}

android {
  namespace "com.reactnativemonriandroidios"

  compileSdk getExtOrIntegerDefault('compileSdkVersion')
  defaultConfig {
    minSdk 21
    targetSdk getExtOrIntegerDefault('targetSdkVersion')
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    debug {
      buildConfigField "String", "MONRI_REACT_NATIVE_PLUGIN_VERSION", "\"${version}\""
    }
    release {
      minifyEnabled false
      buildConfigField "String", "MONRI_REACT_NATIVE_PLUGIN_VERSION", "\"${version}\""
    }
    profile {
      initWith debug
      buildConfigField "String", "MONRI_REACT_NATIVE_PLUGIN_VERSION", "\"${version}\""
      matchingFallbacks = ["debug"]
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  lint {
    disable += ['GradleCompatible']
  }
}

repositories {
  google()
  mavenCentral()
  maven { 
    url 'https://jitpack.io' 
  }

  def found = false
  def defaultDir
  def androidSourcesName = 'React Native sources'

  if (rootProject.ext.has('reactNativeAndroidRoot')) {
    defaultDir = rootProject.ext.get('reactNativeAndroidRoot')
  } else {
    defaultDir = new File(projectDir, '/../../../node_modules/react-native/android')
  }

  if (defaultDir.exists()) {
    maven { 
      url defaultDir.toString(); 
      name androidSourcesName 
    }
    logger.info(":${project.name}:reactNativeAndroidRoot ${defaultDir.canonicalPath}")
    found = true
  } else {
    def parentDir = rootProject.projectDir
    1.upto(5, {
      if (found) return true
      parentDir = parentDir.parentFile

      def androidSourcesDir = new File(parentDir, 'node_modules/react-native')
      def androidPrebuiltBinaryDir = new File(parentDir, 'node_modules/react-native/android')

      if (androidPrebuiltBinaryDir.exists()) {
        maven { 
          url androidPrebuiltBinaryDir.toString(); 
          name androidSourcesName 
        }
        logger.info(":${project.name}:reactNativeAndroidRoot ${androidPrebuiltBinaryDir.canonicalPath}")
        found = true
      } else if (androidSourcesDir.exists()) {
        maven { 
          url androidSourcesDir.toString(); 
          name androidSourcesName 
        }
        logger.info(":${project.name}:reactNativeAndroidRoot ${androidSourcesDir.canonicalPath}")
        found = true
      }
    })
  }

  if (!found) {
    throw new GradleException("${project.name}: unable to locate React Native android sources. Ensure React Native is installed and try again.")
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-wallet:19.4.0"
  implementation "com.facebook.react:react-android:0.80.0"
  implementation 'com.monri:monri-android:3.2.3'
  implementation 'androidx.preference:preference:1.2.1'
}
